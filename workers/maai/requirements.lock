# MaAI ワーカーの依存の固定。.venv の実バージョンから、必要な分だけを写した（2026-11-08）。
# Kokoro、misaki、spacy は含めない。
#
# 必ず --no-deps で入れる:
#   pip install --no-deps -r workers/maai/requirements.lock
# 理由: maai の配布メタデータは PyAudio（要 portaudio）、PyQt5 などの GUI 依存と onnxruntime-gpu を
# 要求するが、process(x1, x2) を直接呼ぶ構成では使わない。pyaudio は workers/maai/compat のスタブで
# 代わりにするので PYTHONPATH=workers/maai/compat を付けて起動する。
#
# torch の +cpu は PyTorch の配布サイトにある。
--extra-index-url https://download.pytorch.org/whl/cpu

