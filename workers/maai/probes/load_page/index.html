<!doctype html>
<html><head><meta charset="utf-8"><title>G0 render load</title>
<style>html,body{margin:0;height:100%;background:#222}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body><script type="module">
// G0 の描画負荷ページ。VRM を glTF として読み（three-vrm は使わない）、スキニングとモーフを毎フレーム更新する。
// モデル指定がなければ同程度の三角形数の手続き的な形状を描く。
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdde3ea);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 1.3, 2.4);
camera.lookAt(0, 1.25, 0);
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(1, 3, 2);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key, new THREE.AmbientLight(0xffffff, 0.8));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x99a0a8 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const bones = [], morphs = [];
let modelInfo = 'procedural';
if (q.get('model')) {
  const gltf = await new GLTFLoader().loadAsync(q.get('model'));
  gltf.scene.rotation.y = Math.PI;
  gltf.scene.traverse((o) => {
    if (o.isBone) bones.push(o);
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
      if (o.morphTargetInfluences) morphs.push(o);
    }
  });
  scene.add(gltf.scene);
  modelInfo = q.get('model');
} else {
  const m = new THREE.Mesh(new THREE.TorusKnotGeometry(0.3, 0.1, 400, 90), new THREE.MeshStandardMaterial({ color: 0x8866cc }));
  m.position.y = 1.2;
  m.castShadow = true;
  scene.add(m);
  morphs.length = 0;
}
const frames = [];
let last = performance.now();
window.__stats = () => {
  const s = [...frames].sort((a, b) => a - b);
  const p = (x) => s[Math.min(s.length - 1, Math.floor(s.length * x))];
  return { n: s.length, fps: s.length / (s.reduce((a, b) => a + b, 0) / 1000), frame_ms_p50: p(0.5), frame_ms_p95: p(0.95), frame_ms_max: s[s.length - 1],
    triangles: renderer.info.render.triangles, calls: renderer.info.render.calls, bones: bones.length, morph_meshes: morphs.length, model: modelInfo,
    renderer: (() => { const g = renderer.getContext(); const d = g.getExtension('WEBGL_debug_renderer_info'); return d ? g.getParameter(d.UNMASKED_RENDERER_WEBGL) : 'unknown'; })() };
};
const base = bones.map((b) => b.rotation.clone());
function tick(now) {
  frames.push(now - last);
  last = now;
  const t = now / 1000;
  bones.forEach((b, i) => { b.rotation.x = base[i].x + 0.015 * Math.sin(t * 1.3 + i * 0.1); });
  for (const m of morphs) {
    const inf = m.morphTargetInfluences;
    for (let i = 0; i < Math.min(inf.length, 6); i++) inf[i] = 0.5 + 0.5 * Math.sin(t * 2 + i);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.__ready = true;
</script></body></html>
